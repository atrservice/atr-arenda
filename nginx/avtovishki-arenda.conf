server {
    listen 80;
    listen [::]:80;
    server_name avtovishki-arenda.ru www.avtovishki-arenda.ru;
    
    # Редирект HTTP → HTTPS
    return 301 https://avtovishki-arenda.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.avtovishki-arenda.ru;
    
    # Редирект www → non-www
    return 301 https://avtovishki-arenda.ru$request_uri;
    
    ssl_certificate /etc/letsencrypt/live/avtovishki-arenda.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avtovishki-arenda.ru/privkey.pem;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name avtovishki-arenda.ru;
    
    ssl_certificate /etc/letsencrypt/live/avtovishki-arenda.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avtovishki-arenda.ru/privkey.pem;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Проксирование на Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}